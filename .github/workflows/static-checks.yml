name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check js/script.js
          node --check sw.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"

      - name: Validate project references
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/script.js
          test -f sw.js
          test -f assets/icon.svg
          grep -q 'css/style.css' index.html
          grep -q 'js/script.js' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'reflectionBank' js/script.js
          grep -q 'Generator renungan lokal' index.html
          ! grep -q 'quotes.json' sw.js
          ! grep -q "fetch('assets/quotes.json'" js/script.js

      - name: Parse HTML, XML, and CSS structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET

          class Parser(HTMLParser):
              pass

          for filename in ('index.html', 'about.html', '404.html'):
              parser = Parser()
              parser.feed(Path(filename).read_text(encoding='utf-8'))
              parser.close()
              print(f'OK: {filename}')

          ET.parse('sitemap.xml')
          print('OK: sitemap.xml')

          css = Path('css/style.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'CSS braces are not balanced'
          print('OK: css/style.css')
          PY
